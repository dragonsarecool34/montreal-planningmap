<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Montreal - Interactive Planning Map</title>
    <script src="https://unpkg.com/panzoom@9.4.3/dist/panzoom.min.js"></script>
    <script src="https://gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #064f08;
        color: #f2f3f5;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        display: flex; /* Sets up side-by-side columns */
        height: 100vh;
        width: 100vw;
        overflow: hidden; /* Stops the overall page from scrolling */
        box-sizing: border-box;
      }

      /* ─── SIDEBAR COLUMN PANEL ─── */
      .map-sidebar {
        width: 320px;
        min-width: 320px;
        height: 100%;
        background-color: #28334a; /* Discord-styled sidebar gray */
        border-right: 1px solid #3f4248;
        padding: 24px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        z-index: 20; /* Sits cleanly over expanding map edges */
        box-shadow: 4px 0 16px rgba(0, 0, 0, 0.3);
      }

      .sidebar-title {
        margin-top: 0;
        margin-bottom: 5px;
        color: #5fcb24;
        font-size: 24px;
      }

      .sidebar-desc {
        margin-top: 0;
        margin-bottom: 24px;
        color: #07e1dd;
        font-size: 14px;
        line-height: 1.4;
      }

      /* ─── FULL-SCREEN MAP VIEWPORT ─── */
      /* ─── FULL-SCREEN MAP VIEWPORT ─── */
      .map-viewport {
        flex-grow: 1;
        height: 100%;
        background-color: #2d4c33;
        cursor: grab;
        position: relative;
        display: flex; /* Centers the map when page first opens */
        justify-content: center;
        align-items: center;
        overflow: hidden; /* Clips expanding image edges when zooming */
      }

      .map-viewport:active {
        cursor: grabbing;
      }

      /* ─── FULL-SCREEN MAP VIEWPORT ─── */
      .map-viewport {
        flex-grow: 1;
        height: 100%;
        background-color: #2d4c33;
        cursor: grab;
        position: relative;
        display: flex; /* Centers the map inside the workspace */
        justify-content: center;
        align-items: center;
        overflow: hidden; /* Clips out expanding boundaries when zooming */
      }

      .map-viewport:active {
        cursor: grabbing;
      }

      /* ─── THE WRAPPER CONTAINER (The exact fix) ─── */
      #panzoom-element {
        position: relative;
        display: inline-flex; /* CRITICAL: Collapses container tightly to wrap around your image width */
        align-items: center;
        justify-content: center;
      }

      .map-image {
        display: block;
        width: auto; /* Prevents the image from being artificially stretched by Flexbox width properties */
        height: auto;
        max-width: 100%;
        max-height: 100vh;
        user-select: none;
        -webkit-user-drag: none;
      }

      /* ─── PROJECT COMPATIBLE HITBOXES ─── */
      .map-hitbox {
        position: absolute;
        cursor: pointer;
        border: 2px dashed rgba(255, 255, 255, 0.35); /* Visual guide box */
        background-color: rgba(0, 64, 255, 0.296);
        transition:
          background-color 0.2s,
          border-color 0.2s;
        z-index: 10;
      }

      .map-hitbox:hover {
        background-color: rgba(88, 101, 242, 0.033); /* Discord Blurple */
        border-color: rgba(88, 101, 242, 0.045);
      }

      /* Styled action icons in the top-right header */
      .modal-actions {
        position: absolute;
        top: 15px;
        right: 15px;
        display: flex;
        gap: 8px;
        align-items: center;
      }

      .modal-btn {
        background: none;
        border: none;
        color: #b5bac1;
        font-size: 18px;
        cursor: pointer;
        padding: 6px;
        border-radius: 4px;
        display: flex;
        justify-content: center;
        align-items: center;
        transition:
          background-color 0.2s,
          color 0.2s;
        user-select: none;
      }

      .modal-btn:hover {
        background-color: #35373c;
        color: #ffffff;
      }

      .modal-btn:focus {
        outline: none;
      }

      /* ─── PROJECT DETAILS POP-UP UI (MODAL) ─── */
      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(37, 63, 29, 0.75);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease;
      }

      .modal-overlay.active {
        opacity: 1;
        pointer-events: auto;
      }

      .modal-card {
        background-color: #2b2d31;
        border-radius: 12px;
        width: 90%;
        max-width: 450px;
        padding: 24px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        border: 1px solid #35373c;
        position: relative;
      }

      .modal-title {
        color: #fff;
        margin-top: 0;
        font-size: 24px;
        margin-right: 50px;
      }
      .meta-group {
        margin-bottom: 12px;
        font-size: 14px;
      }
      .meta-label {
        color: #949ba4;
        font-weight: bold;
        text-transform: uppercase;
        font-size: 11px;
      }
      .meta-value {
        color: #dbdee1;
        margin-top: 2px;
      }

      .edit-input {
        width: 100%;
        background-color: #1e1f22;
        border: 1px solid #383a40;
        color: #dbdee1;
        border-radius: 4px;
        padding: 8px;
        font-size: 14px;
        box-sizing: border-box;
        margin-top: 4px;
        display: none;
      }
      textarea.edit-input {
        height: 80px;
        resize: none;
        font-family: inherit;
      }

      .save-btn {
        background-color: #248046;
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 4px;
        font-weight: 500;
        cursor: pointer;
        display: none;
        margin-top: 15px;
        width: 100%;
      }
      .save-btn:hover {
        background-color: #1a6535;
      }
    </style>
  </head>
  <body>
    <!-- 1. The clean sidebar panel (This is now your ONE and ONLY main title holder) -->
    <div class="map-sidebar">
      <h1 class="sidebar-title">Montreal Map</h1>
      <p class="sidebar-desc">
        Scroll to zoom, drag to pan. Click zones to view project details or
        modify town data entries.
      </p>

      <!-- FUTURE CONTAINER: Left empty for your upcoming town warps and management buttons -->
      <div
        id="sidebar-controls"
        style="flex-grow: 1; display: flex; flex-direction: column; gap: 12px"
      ></div>
    </div>

    <!-- 2. The full-bleed map viewport (Notice there are NO extra titles floating out here anymore) -->
    <div class="map-viewport">
      <div id="panzoom-element">
        <img
          id="map-img"
          class="map-image"
          src="mtlmap.png"
          alt="Montreal Town Map"
        />

        <div
          class="map-hitbox"
          style="top: 67%; left: 15.5%; width: 10%; height: 25%"
          onclick="openProject('mansion')"
        ></div>

        <div
          class="map-hitbox"
          style="top: 16%; left: 45.25%; width: 6.45%; height: 16.5%"
          onclick="openProject('cathedral')"
        ></div>

        <div
          class="map-hitbox"
          style="top: 28.5%; left: 67.7%; width: 1.75%; height: 21%"
          onclick="openProject('bridge1')"
        ></div>

        <div
          class="map-hitbox"
          style="top: 16%; left: 38.25%; width: 6.575%; height: 16.5%"
          onclick="openProject('cathedral2')"
        ></div>

        <div
          class="map-hitbox"
          style="top: 49.5%; left: 46.5%; width: 8.75%; height: 8%"
          onclick="openProject('museum')"
        ></div>
        <div
          class="map-hitbox"
          style="top: 60.15%; left: 46.75%; width: 8.25%; height: 7.5%"
          onclick="openProject('shoreside')"
        ></div>
        <div
          class="map-hitbox"
          style="top: 16%; left: 52%; width: 8.5%; height: 16.5%"
          onclick="openProject('townhall')"
        ></div>
      </div>
    </div>

    <!-- ─── THE POP-UP CARD FRAMEWORK ─── -->
    <div class="modal-overlay" id="projectModal" onclick="closeModal()">
      <div class="modal-card" onclick="event.stopPropagation()">
        <div class="modal-actions">
          <!-- 1. Place your edit pencil icon right here next to the close button -->
          <button
            class="modal-btn"
            onclick="toggleEditMode()"
            title="Edit Field"
          >
            ✏️
          </button>
          <button class="modal-btn" onclick="closeModal()">&times;</button>
        </div>

        <!-- Title Field Section -->
        <h2 class="modal-title" id="ui-title">Project Name</h2>
        <input
          type="text"
          id="edit-title"
          class="edit-input"
          style="display: none"
        />

        <!-- Type Field Section -->
        <div class="meta-group">
          <div class="meta-label">Type</div>
          <div class="meta-value" id="ui-type">Type here</div>
          <input
            type="text"
            id="edit-type"
            class="edit-input"
            style="display: none"
          />
        </div>

        <!-- Date Field Section -->
        <div class="meta-group">
          <div class="meta-label">Status / Timeline</div>
          <div class="meta-value" id="ui-date">Dates here</div>
          <input
            type="text"
            id="edit-date"
            class="edit-input"
            style="display: none"
          />
        </div>

        <!-- Builders Field Section -->
        <div class="meta-group">
          <div class="meta-label">Lead Builders</div>
          <div class="meta-value" id="ui-builders">Builders here</div>
          <input
            type="text"
            id="edit-builders"
            class="edit-input"
            style="display: none"
          />
        </div>

        <!-- Details Field Section -->
        <div class="meta-group">
          <div class="meta-label">Project Details</div>
          <div class="meta-value" id="ui-details">Description here</div>
          <!-- Note: We use a textarea for details to allow for longer multi-line text -->
          <textarea
            id="edit-details"
            class="edit-input"
            style="
              display: none;
              height: 80px;
              resize: none;
              width: 100%;
              box-sizing: border-box;
            "
          ></textarea>
        </div>

        <!-- The Save Button: Place this at the absolute bottom of the card -->
        <button
          id="ui-save-btn"
          class="save-btn"
          onclick="saveProjectData()"
          style="
            display: none;
            background-color: #248046;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
          "
        >
          Save Changes
        </button>
      </div>
    </div>
    <script>
      const SECRET_PASSWORD = "concordia";

      const firebaseConfig = {
        apiKey: "AIzaSyCN7lAQ7QBTVW8u5-nzGi_s19788Usk6_4",
        authDomain: "montreal-map-9d9f4.firebaseapp.com",
        projectId: "montreal-map-9d9f4",
        storageBucket: "montreal-map-9d9f4.firebasestorage.app",
        messagingSenderId: "421965610143",
        appId: "1:421965610143:web:b347b22b89cca71e4d76aa",
      };

      // Initialize Firebase Cloud Connection
      firebase.initializeApp(firebaseConfig);
      const db = firebase.firestore();

      let currentProjectId = "";
      let isEditMode = false;
      let globalProjectData = {}; // This empty object will hold your live cloud data rows

      // ─── STEP 5: THE REAL-TIME SYNC ENGINE ───
      // This connects to the cloud and downloads your projects instantly
      db.collection("projects").onSnapshot((snapshot) => {
        snapshot.forEach((doc) => {
          globalProjectData[doc.id] = doc.data();
        });
        // If the info popup card is currently open, instantly update its text on screen
        if (currentProjectId) openProject(currentProjectId);
      });

      // Initialize Panzoom
      window.addEventListener("DOMContentLoaded", () => {
        const element = document.getElementById("panzoom-element");
        panzoom(element, {
          maxZoom: 5,
          minZoom: 0.5,
          bounds: true,
          boundsPadding: 0.1,
        });
      });

      function openProject(projectId) {
        currentProjectId = projectId;

        // Fallback default structure if a project doesn't exist in the cloud yet
        const data = globalProjectData[projectId] || {
          title: "Configuring Zone...",
          type: "TBD",
          date: "TBD",
          builders: "TBD",
          details:
            "Click the edit pencil icon to fill out this project's information!",
        };

        // Inject display text
        document.getElementById("ui-title").innerText = data.title;
        document.getElementById("ui-type").innerText = data.type;
        document.getElementById("ui-date").innerText = data.date;
        document.getElementById("ui-builders").innerText = data.builders;
        document.getElementById("ui-details").innerText = data.details;

        // Pre-fill hidden input textboxes so you don't have to re-type existing data when editing
        document.getElementById("edit-title").value = data.title;
        document.getElementById("edit-type").value = data.type;
        document.getElementById("edit-date").value = data.date;
        document.getElementById("edit-builders").value = data.builders;
        document.getElementById("edit-details").value = data.details;

        document.getElementById("projectModal").classList.add("active");
      }

      function closeModal() {
        exitEditMode(); // Resets input forms cleanly
        document.getElementById("projectModal").classList.remove("active");
        currentProjectId = "";
      }
      function toggleEditMode() {
        if (!isEditMode) {
          // Prompt user for management password
          const passwordAttempt = prompt(
            "Enter town management password to unlock editing:",
          );
          if (passwordAttempt !== SECRET_PASSWORD) {
            alert("Incorrect password. Access Denied.");
            return;
          }
          isEditMode = true;
          setFormDisplayStyles("none", "block");
        } else {
          exitEditMode();
        }
      }

      function saveProjectData() {
        // Collect the text string values out of your input fields
        const updatedData = {
          title: document.getElementById("edit-title").value,
          type: document.getElementById("edit-type").value,
          date: document.getElementById("edit-date").value,
          builders: document.getElementById("edit-builders").value,
          details: document.getElementById("edit-details").value,
        };

        // Pushes the updated object row straight to your Firebase project collection
        db.collection("projects")
          .doc(currentProjectId)
          .set(updatedData)
          .then(() => {
            exitEditMode();
          })
          .catch((error) => {
            alert("Error saving data to the cloud: " + error.message);
          });
      }

      function exitEditMode() {
        isEditMode = false;
        setFormDisplayStyles("block", "none");
      }

      function setFormDisplayStyles(viewStyle, editStyle) {
        // Hide or show text view blocks
        document.getElementById("ui-title").style.display = viewStyle;
        document.getElementById("ui-type").style.display = viewStyle;
        document.getElementById("ui-date").style.display = viewStyle;
        document.getElementById("ui-builders").style.display = viewStyle;
        document.getElementById("ui-details").style.display = viewStyle;

        // Hide or show edit textboxes
        document.getElementById("edit-title").style.display = editStyle;
        document.getElementById("edit-type").style.display = editStyle;
        document.getElementById("edit-date").style.display = editStyle;
        document.getElementById("edit-builders").style.display = editStyle;
        document.getElementById("edit-details").style.display = editStyle;
        document.getElementById("ui-save-btn").style.display = editStyle;
      }
      // Manually expose your functions to the global window scope
      window.toggleEditMode = toggleEditMode;
      window.saveProjectData = saveProjectData;
    </script>
  </body>
</html>
